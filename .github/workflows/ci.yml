# CI for ai-execution-router
#
# Node matrix note (verified, not guessed):
#   The repo runs TypeScript directly via Node's native type stripping
#   ("test": "node --test tests/*.test.ts" in package.json). Type stripping
#   is enabled by default only on Node >= 22.18 (and >= 23.6). Under Node
#   20.x and 22.13 the suite fails with ERR_UNKNOWN_FILE_EXTENSION ".ts";
#   under 22.22 all 33 tests pass. A Node 20 lane would therefore be
#   permanently red, so the matrix is 22 + 24. If Node 20 support becomes a
#   requirement, the package must ship compiled JS; the dev/test workflow
#   itself still needs >= 22.18.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "22" resolves to latest 22.x (>= 22.18, so type stripping is on
        # by default). "24" is the current LTS line.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # package-lock.json is committed (lockfileVersion 3), so npm ci is
      # correct here.
      - name: Install
        run: npm ci

      # tsconfig.json sets noEmit: true, so running tsc against it is a
      # pure typecheck — the same gate documented in the README, invoked by
      # the same name a contributor runs locally.
      - name: Typecheck
        run: npm run typecheck

      # Exact script from package.json: "node --test tests/*.test.ts".
      - name: Test
        run: npm test

  # The published artefact, on the Node version consumers actually run.
  #
  # The test lane above runs TypeScript sources on Node 22+. That proves the
  # sources work; it proves nothing about the tarball. This lane builds, packs,
  # installs into a clean directory and imports the result on Node 20 — the
  # floor declared in `engines` — so a broken `files` list, a missing `dist`, a
  # bad `exports` map or a stray TypeScript import fails here rather than in
  # someone else's install.
  package:
    name: Packaged artefact (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Building needs the devDependencies; `npm ci` on Node 20 is fine because
      # nothing here executes the .ts sources directly.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack --pack-destination /tmp

      - name: Install the tarball into a clean project
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install /tmp/ai-execution-router-*.tgz

      # Imports through the package root, exercising the `exports` map rather
      # than a relative path into the repo.
      - name: Import and exercise the published entrypoint
        run: |
          cd /tmp/consumer
          cat > check.mjs <<'EOF'
          import { complete, AuthError, PermanentError, QuotaExhaustedError } from "ai-execution-router";

          // Error hierarchy survived the build (a structural claim of the release).
          if (!(new QuotaExhaustedError("x") instanceof PermanentError)) {
            throw new Error("QuotaExhaustedError must extend PermanentError");
          }

          // Reaches the guards without touching the network.
          const expect = async (label, params, Type) => {
            try {
              await complete(params);
            } catch (err) {
              if (err instanceof Type) return;
              throw new Error(`${label}: expected ${Type.name}, got ${err?.name}: ${err?.message}`);
            }
            throw new Error(`${label}: expected ${Type.name}, got success`);
          };

          const input = { messages: [{ role: "user", content: "hi" }] };
          await expect("unknown wire shape", { model: "m", input, endpoint: { provider: "nope", apiKey: "k" } }, PermanentError);
          await expect("missing credential", { model: "m", input, endpoint: { provider: "openai-chat", baseUrl: "https://x.test/v1" } }, AuthError);

          console.log("packaged artefact OK");
          EOF
          node check.mjs

      # The smoke harness must at least load and report cleanly with no
      # credentials configured; a syntax or import error here is a broken tool.
      #
      # Asserting on exit code 78 specifically, not just "non-zero": the harness
      # exits 1 for a missing dist/, and node itself exits 1 on a syntax error,
      # so `test $? -eq 1` passed for the broken cases as loudly as for the
      # healthy one and could never detect what this step exists to detect.
      - name: Smoke harness loads
        run: |
          cd /tmp/consumer/node_modules/ai-execution-router
          set +e
          node scripts/smoke.mjs
          code=$?
          set -e
          if [ "$code" -ne 78 ]; then
            echo "::error::smoke.mjs exited $code, expected 78 (loaded, no targets configured)"
            exit 1
          fi
